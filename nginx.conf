server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml image/svg+xml;

    # Headers are declared once at server level. Do not add `add_header` inside
    # a location block: nginx would then drop these for that location.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite puts a content hash in every file name under /assets, so they can be cached for a year.
    location /assets/ {
        expires 1y;
        access_log off;
    }

    # Images, icons and fonts outside /assets are not hashed: cache for a month.
    location ~* \.(?:ico|gif|jpe?g|png|webp|avif|svg|woff2?|ttf|webmanifest)$ {
        expires 30d;
        access_log off;
    }

    # index.html must never be cached, otherwise a deploy is invisible until the cache expires.
    location = /index.html {
        expires -1;
    }

    # SPA routing: any path that is not a real file is handled by React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
